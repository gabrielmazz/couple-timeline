name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: loafkhnjrwhppddwztof
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)

      - name: Link Supabase project
        run: |
          args=(--project-ref "$SUPABASE_PROJECT_REF")
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            args+=(--password "$SUPABASE_DB_PASSWORD")
          fi

          npx supabase link "${args[@]}"

      - name: Preview database migrations
        run: |
          args=(--linked --include-all --dry-run)
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            args+=(--password "$SUPABASE_DB_PASSWORD")
          fi

          npx supabase db push "${args[@]}"

      - name: Apply database migrations
        run: |
          args=(--linked --include-all --yes)
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            args+=(--password "$SUPABASE_DB_PASSWORD")
          fi

          npx supabase db push "${args[@]}"

  deploy-worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      IMAGE_SIGNING_SECRET: ${{ secrets.IMAGE_SIGNING_SECRET }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || secrets.ALLOWED_ORIGINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare Worker credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "Missing SUPABASE_PUBLISHABLE_KEY" && exit 1)
          test -n "$IMAGE_SIGNING_SECRET" || (echo "Missing IMAGE_SIGNING_SECRET" && exit 1)
          test -n "$ALLOWED_ORIGINS" || (echo "Missing ALLOWED_ORIGINS" && exit 1)

      - name: Prepare Worker secrets file
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const names = [
            'SUPABASE_URL',
            'SUPABASE_PUBLISHABLE_KEY',
            'IMAGE_SIGNING_SECRET',
            'ALLOWED_ORIGINS',
          ]
          const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]))
          fs.writeFileSync('.wrangler-secrets.json', `${JSON.stringify(secrets)}\n`, { mode: 0o600 })
          NODE

      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy --secrets-file .wrangler-secrets.json

  build:
    runs-on: ubuntu-latest
    needs:
      - migrate
      - deploy-worker
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TIMELINE_IMAGE_PROVIDER: ${{ vars.VITE_TIMELINE_IMAGE_PROVIDER || 'supabase' }}
      VITE_TIMELINE_IMAGE_API_URL: ${{ vars.VITE_TIMELINE_IMAGE_API_URL || secrets.VITE_TIMELINE_IMAGE_API_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository hygiene
        run: npm run check:env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
