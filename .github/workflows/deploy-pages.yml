name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    env:
      VITE_TIMELINE_IMAGE_PROVIDER: r2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      IMAGE_SIGNING_SECRET: ${{ secrets.IMAGE_SIGNING_SECRET }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || secrets.ALLOWED_ORIGINS }}
    steps:
      - name: Skip Worker deploy unless private R2 provider is enabled
        if: env.VITE_TIMELINE_IMAGE_PROVIDER != 'r2'
        run: |
          echo "VITE_TIMELINE_IMAGE_PROVIDER=$VITE_TIMELINE_IMAGE_PROVIDER"
          echo "Skipping Cloudflare Worker deploy. Worker is only required for VITE_TIMELINE_IMAGE_PROVIDER=r2."

      - name: Checkout
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        uses: actions/checkout@v4

      - name: Setup Node
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        run: npm ci

      - name: Validate Cloudflare Worker credentials
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$IMAGE_SIGNING_SECRET" || (echo "Missing IMAGE_SIGNING_SECRET" && exit 1)
          test -n "$ALLOWED_ORIGINS" || (echo "Missing ALLOWED_ORIGINS" && exit 1)

      - name: Prepare Worker secrets file
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const names = [
            'IMAGE_SIGNING_SECRET',
            'ALLOWED_ORIGINS',
          ]
          const secrets = Object.fromEntries(names.map((name) => [name, process.env[name]]))
          fs.writeFileSync('.wrangler-secrets.json', `${JSON.stringify(secrets)}\n`, { mode: 0o600 })
          NODE

      - name: Deploy Cloudflare Worker
        if: env.VITE_TIMELINE_IMAGE_PROVIDER == 'r2'
        run: npx wrangler deploy --secrets-file .wrangler-secrets.json

  build:
    runs-on: ubuntu-latest
    needs:
      - deploy-worker
    env:
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyDz7Lo4Q7TQMRWpKAdO7cBmyiujfYqiBJI' }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'couple-timeline-3eae7.firebaseapp.com' }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'couple-timeline-3eae7' }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:277719898258:web:511b9e031a599fac92ee4b' }}
      VITE_TIMELINE_IMAGE_PROVIDER: r2
      VITE_TIMELINE_IMAGE_API_URL: ${{ vars.VITE_TIMELINE_IMAGE_API_URL || secrets.VITE_TIMELINE_IMAGE_API_URL || 'https://couple-timeline.gabriel-mazzuco.workers.dev' }}
      VITE_BASE_PATH: /couple-timeline/
      VITE_TIMELINE_IMAGE_PUBLIC_URL: ${{ vars.VITE_TIMELINE_IMAGE_PUBLIC_URL || secrets.VITE_TIMELINE_IMAGE_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository hygiene
        run: npm run check:env

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        
